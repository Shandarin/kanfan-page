<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>技术支持与反馈 - Kanfan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 自定义一些简单的加载动画或样式 */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-4">

<div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8 text-center space-y-6">
    <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z"></path>
        </svg>
    </div>

    <h1 class="text-2xl font-bold text-gray-800">留言</h1>
    <p class="text-gray-500 text-sm">
        请点击右下角的聊天图标提交您的留言，我们看到后会通过邮件回复您。
    </p>

    <div id="debug-info" class="text-left bg-gray-50 p-4 rounded-lg text-xs text-gray-600 space-y-2 border">
        <p><strong>来源:</strong> <span id="info-from">-</span></p>
        <p><strong>插件版本:</strong> <span id="info-v">-</span></p>
        <p><strong>来源页面:</strong> <span class="break-all" id="info-url">-</span></p>
        <p><strong>账号邮箱:</strong> <span id="info-email">-</span></p>
    </div>
</div>

<script type="text/javascript">
    // 1. 读取 URL 参数
    const urlParams = new URLSearchParams(window.location.search);
    const sourceFrom = urlParams.get('from') || 'web';
    const extVersion = urlParams.get('v') || '未知';
    const issueUrl = urlParams.get('url') || '未知';
    const userId = urlParams.get('uid') || '';
    const userEmail = urlParams.get('email') || '';

    // 更新页面上的显示（可选，仅为了用户体验）
    document.getElementById('info-from').textContent = sourceFrom === 'ext' ? '浏览器插件' : '网页端';
    document.getElementById('info-v').textContent = extVersion;
    document.getElementById('info-url').textContent = issueUrl;
    document.getElementById('info-email').textContent = userEmail || '未登录';

    // 2. 初始化 Tawk API
    var Tawk_API = Tawk_API || {};
    var Tawk_LoadStart = new Date();

    // 预填充用户信息（如果存在邮箱）
    if (userEmail) {
        Tawk_API.visitor = {
            name: userEmail.split('@')[0],
            email: userEmail
        };
    }

    // 当 Tawk.to 加载完成后，将插件带来的参数作为自定义属性附加到此工单/会话上
    Tawk_API.onLoad = function() {
        Tawk_API.setAttributes({
            'source': sourceFrom,
            'extension_version': extVersion,
            'issue_url': issueUrl,
            'user_id': userId
        }, function (error) {
            if(error) console.error("[Tawk] Error setting attributes", error);
        });

        // 可选：自动打开留言窗口
        // Tawk_API.maximize();
    };

    // 3. 注入 Tawk.to 核心代码
    (function(){
        var s1 = document.createElement("script"), s0 = document.getElementsByTagName("script")[0];
        s1.async = true;
        s1.src = 'https://embed.tawk.to/699ad0a49f81c11c340d8ed3/1ji2bu1im';
        s1.charset = 'UTF-8';
        s1.setAttribute('crossorigin','*');
        s0.parentNode.insertBefore(s1,s0);
    })();
</script>
</body>
</html>
