<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>技术支持与反馈 - Kanfan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="i18n.js"></script>
</head>
<body class="form-page">

<main class="support-shell">
    <div class="page-card-header">
        <a href="index.html" class="brand-mark" aria-label="Kanfan home">
            <img src="logo.png" alt="Kanfan" class="site-logo-img" onerror="this.hidden=true; this.nextElementSibling.hidden=false;">
            <span>Kanfan</span>
        </a>
        <h1 class="page-card-title" data-i18n="support.title">留言反馈</h1>
        <p class="page-card-desc" data-i18n="support.desc">请在下方填写您的留言，提交后我们会通过邮件尽快回复您。</p>
    </div>

    <div id="debug-info" class="debug-box">
        <p><span class="debug-info-label" data-i18n="support.debug.source">来源:</span> <span id="info-from" class="debug-info-value">-</span></p>
        <p><span class="debug-info-label" data-i18n="support.debug.version">插件版本:</span> <span id="info-v" class="debug-info-value">-</span></p>
        <p><span class="debug-info-label" data-i18n="support.debug.page">来源页面:</span> <span id="info-url" class="debug-info-value">-</span></p>
        <p><span class="debug-info-label" data-i18n="support.debug.email">账号邮箱:</span> <span id="info-email" class="debug-info-value">-</span></p>
    </div>

    <form id="support-form" method="POST" class="form-stack">
        <input type="hidden" name="source" id="input-from">
        <input type="hidden" name="extension_version" id="input-v">
        <input type="hidden" name="issue_url" id="input-url">
        <input type="hidden" name="user_id" id="input-uid">

        <div>
            <label for="input-email" data-i18n="support.form.emailLabel">您的邮箱</label>
            <input type="email" name="email" id="input-email" required placeholder="name@example.com" data-i18n-placeholder="support.form.emailPlaceholder">
        </div>

        <div>
            <label for="support-message" data-i18n="support.form.messageLabel">留言内容</label>
            <textarea id="support-message" name="message" required rows="4" placeholder="请详细描述您遇到的情况或建议..." data-i18n-placeholder="support.form.messagePlaceholder"></textarea>
        </div>

        <button type="submit" id="submit-btn" class="submit-btn" data-i18n="support.form.submit">发送留言</button>
        <div class="support-status success" id="successMsg">Thank you! Your message has been submitted.</div>
        <div class="support-status error" id="errorMsg">Oops! Something went wrong. Please try again.</div>
    </form>
</main>

<script>
    KanfanI18n.apply();
    document.title = KanfanI18n.t('support.pageTitle');

    const urlParams = new URLSearchParams(window.location.search);
    const sourceFrom = urlParams.get('from') || 'web';
    const extVersion = urlParams.get('v') || KanfanI18n.t('support.meta.unknown');
    const rawIssueUrl = urlParams.get('url') || KanfanI18n.t('support.meta.unknown');
    const displayIssueUrl = rawIssueUrl.length > 100 ? `${rawIssueUrl.substring(0, 97)}...` : rawIssueUrl;
    const userId = urlParams.get('uid') || '';
    const userEmail = urlParams.get('email') || '';

    document.getElementById('info-from').textContent = sourceFrom === 'ext'
        ? KanfanI18n.t('support.source.ext')
        : KanfanI18n.t('support.source.web');
    document.getElementById('info-v').textContent = extVersion;
    document.getElementById('info-url').textContent = displayIssueUrl;
    document.getElementById('info-url').title = rawIssueUrl;
    document.getElementById('info-email').textContent = userEmail || KanfanI18n.t('support.meta.notLoggedIn');

    document.getElementById('input-from').value = sourceFrom;
    document.getElementById('input-v').value = extVersion;
    document.getElementById('input-url').value = rawIssueUrl;
    document.getElementById('input-uid').value = userId;
    if (userEmail) document.getElementById('input-email').value = userEmail;

    const feedbackEndpoint = "https://jicbnty4ugip4n7rsn6xjg3moe0poghf.lambda-url.us-west-1.on.aws/";
    const supportForm = document.getElementById('support-form');
    const submitBtn = document.getElementById('submit-btn');
    const successMsg = document.getElementById('successMsg');
    const errorMsg = document.getElementById('errorMsg');

    function showSupportError(message) {
        errorMsg.textContent = message || "Oops! Something went wrong. Please try again.";
        errorMsg.style.display = "block";
        successMsg.style.display = "none";
    }

    supportForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        if (!feedbackEndpoint || feedbackEndpoint.includes("REPLACE_WITH")) {
            showSupportError("Feedback endpoint is not configured.");
            return;
        }

        successMsg.style.display = "none";
        errorMsg.style.display = "none";
        submitBtn.disabled = true;

        const payload = {
            type: "support",
            source: sourceFrom,
            extension_version: extVersion,
            issue_url: rawIssueUrl,
            user_id: userId,
            email: document.getElementById('input-email').value.trim(),
            message: (supportForm.querySelector('textarea[name="message"]')?.value || "").trim(),
            page_url: window.location.href,
            user_agent: navigator.userAgent
        };

        try {
            const res = await fetch(feedbackEndpoint, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            supportForm.querySelector('textarea[name="message"]').value = "";
            successMsg.style.display = "block";
        } catch (err) {
            showSupportError();
        } finally {
            submitBtn.disabled = false;
        }
    });
</script>
</body>
</html>
