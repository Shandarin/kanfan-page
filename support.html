<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support - Kanfan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="i18n.js"></script>
    <link rel="stylesheet" href="style.css">

    <style>
        .support-container {
            max-width: 600px;
            margin: 60px auto;
            background: var(--white);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            width: 100%;
        }
        .page-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--dark);
        }
        .page-desc {
            color: var(--slate);
            font-size: 0.95rem;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: var(--dark);
        }
        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-family: var(--font-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-control:focus {
            border-color: var(--primary);
        }
        textarea.form-control {
            min-height: 120px;
            resize: vertical;
        }
        .readonly-info {
            background: #f1f5f9;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--slate);
            margin-bottom: 24px;
            border: 1px dashed #cbd5e1;
            display: none; /* 默认隐藏，有参数时显示 */
        }
        .readonly-info p { margin-bottom: 4px; }
        .readonly-info p:last-child { margin-bottom: 0; }
        .readonly-info span { font-weight: 600; color: var(--dark); }

        .submit-btn {
            width: 100%;
            background: var(--primary);
            color: var(--white);
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .submit-btn:hover { background: var(--primary-hover); }
        .submit-btn:disabled { background: #cbd5e1; cursor: not-allowed; }

        .msg { display: none; padding: 12px; border-radius: 8px; margin-top: 16px; font-weight: 600; text-align: center; }
        .msg.success { background: #dcfce7; color: var(--success); display: block; }
        .msg.error { background: #fee2e2; color: var(--danger); display: block; }
    </style>
</head>
<body>
<div style="position: fixed; top: 16px; right: 16px; z-index: 999;" data-lang-switcher></div>

<div class="support-container">
    <h1 class="page-title" data-i18n="support.title">Contact Support</h1>
    <p class="page-desc" data-i18n="support.desc">How can we help you today?</p>

    <div id="context-info" class="readonly-info">
        <p id="info-email" style="display: none;" data-i18n-label="support.user">User: <span id="val-email"></span></p>
        <p id="info-url" style="display: none;" data-i18n-label="support.page">Page URL: <span id="val-url"></span></p>
        <p id="info-version" style="display: none;" data-i18n-label="support.version">Ext Version: <span id="val-version"></span></p>
    </div>

    <form id="support-form">
        <div class="form-group">
            <label class="form-label" data-i18n="support.type">Issue Type</label>
            <select id="issue-type" class="form-control" required>
                <option value="bug" data-i18n="support.typeBug">Bug Report</option>
                <option value="translation" data-i18n="support.typeTrans">Translation Error</option>
                <option value="billing" data-i18n="support.typeBilling">Billing / Subscription</option>
                <option value="feature" data-i18n="support.typeFeature">Feature Request</option>
                <option value="other" data-i18n="support.typeOther">Other</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label" data-i18n="support.subject">Subject</label>
            <input type="text" id="subject" class="form-control" required data-i18n-placeholder="support.subjectPlaceholder" placeholder="Briefly describe the issue">
        </div>

        <div class="form-group">
            <label class="form-label" data-i18n="support.content">Description</label>
            <textarea id="content" class="form-control" required data-i18n-placeholder="support.contentPlaceholder" placeholder="Please provide as much detail as possible..."></textarea>
        </div>

        <button type="submit" id="submit-btn" class="submit-btn" data-i18n="support.submit">Submit Ticket</button>
        <div id="status-msg" class="msg" style="display: none;"></div>
    </form>
</div>

<script>
    // 初始化 Supabase (替换为你的真实配置)
    const SUPABASE_URL = 'https://YOUR_PROJECT.supabase.co';
    const SUPABASE_KEY = 'YOUR_ANON_KEY';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 初始化 i18n
    KanfanI18n.apply();
    KanfanI18n.renderSelect(document.querySelector('[data-lang-switcher]'));

    // 解析 URL 参数
    const params = new URLSearchParams(window.location.search);
    const extVersion = params.get('v') || '';
    const currentUrl = params.get('url') || '';
    const uid = params.get('uid') || '';
    const email = params.get('email') || '';
    const fromExt = params.get('from') === 'ext';

    // 填充上下文面板并显示
    const contextPanel = document.getElementById('context-info');
    let hasContext = false;

    if (email) {
        document.getElementById('val-email').textContent = email;
        document.getElementById('info-email').style.display = 'block';
        hasContext = true;
    }
    if (currentUrl) {
        document.getElementById('val-url').textContent = currentUrl;
        document.getElementById('info-url').style.display = 'block';
        hasContext = true;
    }
    if (extVersion) {
        document.getElementById('val-version').textContent = extVersion;
        document.getElementById('info-version').style.display = 'block';
        hasContext = true;
    }

    if (hasContext) {
        contextPanel.style.display = 'block';
    }

    // 提交表单逻辑
    const form = document.getElementById('support-form');
    const btn = document.getElementById('submit-btn');
    const statusMsg = document.getElementById('status-msg');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        btn.disabled = true;
        btn.textContent = KanfanI18n.t('support.submitting') || 'Submitting...';
        statusMsg.style.display = 'none';

        const issueType = document.getElementById('issue-type').value;
        const subject = document.getElementById('subject').value.trim();
        const content = document.getElementById('content').value.trim();

        try {
            // 写入 Supabase tickets 表
            const { error } = await sb.from('tickets').insert([
                {
                    user_id: uid || null,  // 允许未登录用户提交，或者使用 null
                    email: email || 'anonymous',
                    issue_type: issueType,
                    title: subject,
                    content: content,
                    ext_version: extVersion,
                    page_url: currentUrl,
                    source: fromExt ? 'extension' : 'web',
                    status: 'open'
                }
            ]);

            if (error) throw error;

            // 成功
            form.style.display = 'none';
            contextPanel.style.display = 'none';
            statusMsg.className = 'msg success';
            statusMsg.textContent = KanfanI18n.t('support.success') || 'Ticket submitted successfully! We will get back to you soon.';
            statusMsg.style.display = 'block';

        } catch (err) {
            console.error('Submit error:', err);
            btn.disabled = false;
            btn.textContent = KanfanI18n.t('support.submit') || 'Submit Ticket';
            statusMsg.className = 'msg error';
            statusMsg.textContent = KanfanI18n.t('support.error') || 'Failed to submit ticket. ' + err.message;
            statusMsg.style.display = 'block';
        }
    });
</script>
</body>
</html>
