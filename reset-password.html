<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reset Password - Kanfan</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="i18n.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

<div class="language-switcher" data-lang-switcher></div>
<div class="auth-container card">

  <div id="loading-view">
    <div class="reset-state">
      <div class="spinner"></div>
      <h3 class="result-title"><span data-i18n="reset.verifying">Verifying link...</span></h3>
    </div>
  </div>

  <div id="request-view" class="hide">
    <h1 data-i18n="reset.requestTitle">Forgot Password?</h1>
    <p class="subtitle" data-i18n="reset.requestSubtitle">Enter your email and we'll send you a link to reset your password.</p>

    <form id="request-form">
      <div class="field-group">
        <label for="email" data-i18n="reset.email">Email</label>
        <div class="input-wrapper">
          <input type="email" id="email" data-i18n-placeholder="reset.emailPlaceholder" placeholder="you@example.com" required autocomplete="email">
        </div>
      </div>

      <button type="submit" id="request-btn" class="submit-btn" data-i18n="reset.sendLink">Send Reset Link</button>
    </form>

    <div class="form-footer">
      <a href="login.html" class="link-muted" data-i18n="reset.backToLogin">Back to Login</a>
    </div>
  </div>

  <div id="main-view" class="hide">
    <h1 data-i18n="reset.title">Reset Password</h1>
    <p class="subtitle" data-i18n="reset.subtitle">Enter your new password below.</p>

    <form id="form">
      <div class="field-group">
        <label for="pw1" data-i18n="reset.new">New Password</label>
        <div class="input-wrapper">
          <input type="password" id="pw1" data-i18n-placeholder="reset.pwPlaceholder" placeholder="At least 6 characters" required autocomplete="new-password">
          <button type="button" class="toggle-pw" data-toggle-pw="pw1" title="Show password">
            <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>

      <div class="field-group">
        <label for="pw2" data-i18n="reset.confirm">Confirm Password</label>
        <div class="input-wrapper">
          <input type="password" id="pw2" data-i18n-placeholder="reset.pw2Placeholder" placeholder="Confirm new password" required autocomplete="new-password">
          <button type="button" class="toggle-pw" data-toggle-pw="pw2" title="Show password">
            <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>

      <button type="submit" id="btn" class="submit-btn" data-i18n="reset.update">Update Password</button>
    </form>
  </div>

  <div id="status-box" class="msg hidden"></div>
</div>

<script>
  // ========= 配置区域 =========
  const SUPABASE_URL = "https://ikriqgjylpbwqihwpsho.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_xdQsvfTfJEwfNjF5KYvxLA_y4QiKqFo";
  // ==========================
  KanfanI18n.renderSelect(document.querySelector("[data-lang-switcher]"));
  KanfanI18n.apply();

  // UI 元素引用
  const views = {
    loading: document.getElementById("loading-view"),
    request: document.getElementById("request-view"),
    main: document.getElementById("main-view"),
    status: document.getElementById("status-box"),
    btn: document.getElementById("btn"),
    form: document.getElementById("form"),
    requestForm: document.getElementById("request-form"),
    requestBtn: document.getElementById("request-btn"),
    email: document.getElementById("email"),
    pw1: document.getElementById("pw1"),
    pw2: document.getElementById("pw2")
  };

  // 初始化 Supabase
  let sb;
  try {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch (e) {
    showStatus("Failed to load Supabase client.", "err");
  }

  // 状态显示
  function showStatus(text, type) {
    // 映射 type 到 style.css 的类名 (error/success)
    const className = type === 'err' ? 'error' : 'success';
    views.status.textContent = text;
    views.status.className = `msg ${className}`;
    views.status.style.display = 'block'; // 确保显示

    if (type === 'err' && (text.includes("expired") || text.includes("Invalid"))) {
      views.main.classList.add("hide");
      views.loading.classList.add("hide");
      views.request.classList.add("hide");
    }
  }

  // 密码可见性切换
  window.togglePw = function(id) {
    const el = document.getElementById(id);
    const btn = el.nextElementSibling; // 获取按钮

    if (el.type === "password") {
      el.type = "text";
      // 切换图标为 '隐藏' (斜线眼)
      btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
    } else {
      el.type = "password";
      // 切换图标为 '显示' (正常眼)
      btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
    }
  }

  document.querySelectorAll("[data-toggle-pw]").forEach((button) => {
    button.addEventListener("click", () => window.togglePw(button.dataset.togglePw));
  });

  function successMarkup(title, desc, href, label) {
    return `
      <div class="reset-state">
        <div class="result-icon">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        </div>
        <h3 class="result-title">${title}</h3>
        <p class="result-desc">${desc}</p>
        <a href="${href}" class="submit-btn">${label}</a>
      </div>
    `;
  }

  function clearUrlHash() {
    try {
      history.replaceState(null, document.title, window.location.pathname + window.location.search);
    } catch (_) {}
  }

  // 解析 Hash 参数
  function parseHashParams() {
    const hash = window.location.hash || "";
    if (!hash.startsWith("#")) return {};
    return hash.substring(1).split("&").reduce((acc, curr) => {
      const [k, v] = curr.split("=");
      if (k) acc[decodeURIComponent(k)] = decodeURIComponent(v || "");
      return acc;
    }, {});
  }

  // 主流程
  async function init() {
    const p = parseHashParams();

    // 1. 处理错误回调
    if (p.error) {
      const desc = (p.error_description || p.error).replace(/\+/g, " ");
      views.loading.classList.add("hide");
      showStatus(`Link Error: ${desc}`, "err");
      return;
    }

    // 2. 检查 Token
    const access_token = p.access_token;
    const refresh_token = p.refresh_token;
    const type = p.type;

    // 没有 token：用户直接访问本页（例如点击登录页的"忘记密码？"），显示发送邮件表单
    if (!access_token || !refresh_token) {
      views.loading.classList.add("hide");
      views.request.classList.remove("hide");
      return;
    }

    if (type && type !== "recovery") {
      views.loading.classList.add("hide");
      showStatus("Invalid link type.", "err");
      return;
    }

    clearUrlHash();

    // 3. 建立会话
    const { error } = await sb.auth.setSession({ access_token, refresh_token });
    views.loading.classList.add("hide");

    if (error) {
      showStatus(`Session Error: ${error.message}`, "err");
      return;
    }

    // 4. 显示重置表单
    views.main.classList.remove("hide");
  }

  // 表单提交
  views.form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const p1 = views.pw1.value.trim();
    const p2 = views.pw2.value.trim();

    if (p1.length < 6) {
      showStatus("Password is too short (min 6 chars).", "err");
      return;
    }
    if (p1 !== p2) {
      showStatus("Passwords do not match.", "err");
      return;
    }

    views.btn.disabled = true;
    views.btn.innerHTML = `<span class="spinner"></span> ${KanfanI18n.t("reset.updating")}`;
    views.status.style.display = "none";

    const { error } = await sb.auth.updateUser({ password: p1 });

    if (error) {
      views.btn.disabled = false;
      views.btn.textContent = KanfanI18n.t("reset.update");
      showStatus(error.message, "err");
      return;
    }

    await sb.auth.signOut();

    views.form.innerHTML = successMarkup(
      KanfanI18n.t("reset.doneTitle"),
      KanfanI18n.t("reset.doneDesc"),
      "login.html",
      KanfanI18n.t("reset.gotoLogin")
    );
  });

  // 请求重置邮件表单提交
  views.requestForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = views.email.value.trim();
    if (!email) return;

    views.requestBtn.disabled = true;
    views.requestBtn.innerHTML = `<span class="spinner"></span> ${KanfanI18n.t("reset.sending")}`;
    views.status.style.display = "none";

    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/reset-password.html',
    });

    if (error) {
      views.requestBtn.disabled = false;
      views.requestBtn.textContent = KanfanI18n.t("reset.sendLink");
      showStatus(error.message, "err");
      return;
    }

    views.requestForm.innerHTML = successMarkup(
      KanfanI18n.t("reset.sentTitle"),
      KanfanI18n.t("reset.sentDesc"),
      "login.html",
      KanfanI18n.t("reset.backToLogin")
    );
  });

  init().catch(err => {
    views.loading.classList.add("hide");
    showStatus("System Error: " + err.message, "err");
  });

</script>
</body>
</html>
