
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Reset Password - Kanfan</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">

<style>
   /* =========================================
      Dark Theme Overrides (暗色模式覆盖)
      ========================================= */
 body {
   background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
   color: var(--white);
 }

/* 覆盖 style.css 中的 .auth-container 为半透明暗色 */
.auth-container {
  background: rgba(15, 23, 42, 0.6);
  border: 1px solid rgba(148, 163, 184, 0.1);
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
}

h1, p.subtitle { text-align: center; }
h1 { margin-bottom: 0.5rem; }
p.subtitle { color: var(--slate); margin-bottom: 2rem; font-size: 0.95rem; }

/* 输入框暗色风格 */
label { display: block; margin-bottom: 6px; font-size: 0.9rem; color: #cbd5e1; }

input[type="password"],
input[type="text"] {
  background: rgba(30, 41, 59, 0.5);
  color: white;
  border-color: rgba(148, 163, 184, 0.2);
  margin-bottom: 0; /* 由 field-group 控制间距 */
}

input:focus {
  background: rgba(30, 41, 59, 0.8);
  border-color: var(--primary);
}

.field-group { margin-bottom: 1.5rem; }

/* 密码输入框的小眼睛按钮定位 */
.input-wrapper { position: relative; width: 100%; }

.toggle-pw {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  color: var(--slate);
  padding: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.2s;
}
.toggle-pw:hover { color: var(--white); }
.toggle-pw svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* 隐藏工具类 */
.hide { display: none !important; }
</style>
</head>
<body>

<div class="auth-container">

  <div id="loading-view">
    <div style="text-align: center; padding: 20px;">
      <div class="spinner" style="margin: 0 auto 10px; width: 24px; height: 24px;"></div>
      <h3 style="font-size:16px; opacity:0.8; font-weight:400;">Verifying link...</h3>
    </div>
  </div>

  <div id="main-view" class="hide">
    <h1>Reset Password</h1>
    <p class="subtitle">Enter your new password below.</p>

    <form id="form">
      <div class="field-group">
        <label for="pw1">New Password</label>
        <div class="input-wrapper">
          <input type="password" id="pw1" placeholder="At least 6 characters" required autocomplete="new-password">
          <button type="button" class="toggle-pw" onclick="togglePw('pw1')" title="Show password">
            <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>

      <div class="field-group">
        <label for="pw2">Confirm Password</label>
        <div class="input-wrapper">
          <input type="password" id="pw2" placeholder="Confirm new password" required autocomplete="new-password">
          <button type="button" class="toggle-pw" onclick="togglePw('pw2')" title="Show password">
            <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>

      <button type="submit" id="btn" class="submit-btn" style="width: 100%;">Update Password</button>
    </form>
  </div>

  <div id="status-box" class="msg hidden"></div>
</div>

<script>
  // ========= 配置区域 =========
  const SUPABASE_URL = "https://ikriqgjylpbwqihwpsho.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_xdQsvfTfJEwfNjF5KYvxLA_y4QiKqFo";
  // ==========================

  // UI 元素引用
  const views = {
    loading: document.getElementById("loading-view"),
    main: document.getElementById("main-view"),
    status: document.getElementById("status-box"),
    btn: document.getElementById("btn"),
    form: document.getElementById("form"),
    pw1: document.getElementById("pw1"),
    pw2: document.getElementById("pw2")
  };

  // 初始化 Supabase
  let sb;
  try {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch (e) {
    showStatus("Failed to load Supabase client.", "err");
  }

  // 状态显示
  function showStatus(text, type) {
    // 映射 type 到 style.css 的类名 (error/success)
    const className = type === 'err' ? 'error' : 'success';
    views.status.textContent = text;
    views.status.className = `msg ${className}`;
    views.status.style.display = 'block'; // 确保显示

    if (type === 'err' && (text.includes("expired") || text.includes("Invalid"))) {
      views.main.classList.add("hide");
      views.loading.classList.add("hide");
    }
  }

  // 密码可见性切换
  window.togglePw = function(id) {
    const el = document.getElementById(id);
    const btn = el.nextElementSibling; // 获取按钮

    if (el.type === "password") {
      el.type = "text";
      // 切换图标为 '隐藏' (斜线眼)
      btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
    } else {
      el.type = "password";
      // 切换图标为 '显示' (正常眼)
      btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
    }
  }

  function clearUrlHash() {
    try {
      history.replaceState(null, document.title, window.location.pathname + window.location.search);
    } catch (_) {}
  }

  // 解析 Hash 参数
  function parseHashParams() {
    const hash = window.location.hash || "";
    if (!hash.startsWith("#")) return {};
    return hash.substring(1).split("&").reduce((acc, curr) => {
      const [k, v] = curr.split("=");
      if (k) acc[decodeURIComponent(k)] = decodeURIComponent(v || "");
      return acc;
    }, {});
  }

  // 主流程
  async function init() {
    const p = parseHashParams();

    // 1. 处理错误回调
    if (p.error) {
      const desc = (p.error_description || p.error).replace(/\+/g, " ");
      views.loading.classList.add("hide");
      showStatus(`Link Error: ${desc}`, "err");
      return;
    }

    // 2. 检查 Token
    const access_token = p.access_token;
    const refresh_token = p.refresh_token;
    const type = p.type;

    if (!access_token || !refresh_token) {
      views.loading.classList.add("hide");
      showStatus("Invalid or expired link. Please check your email again.", "err");
      return;
    }

    if (type && type !== "recovery") {
      views.loading.classList.add("hide");
      showStatus("Invalid link type.", "err");
      return;
    }

    clearUrlHash();

    // 3. 建立会话
    const { error } = await sb.auth.setSession({ access_token, refresh_token });
    views.loading.classList.add("hide");

    if (error) {
      showStatus(`Session Error: ${error.message}`, "err");
      return;
    }

    // 4. 显示重置表单
    views.main.classList.remove("hide");
  }

  // 表单提交
  views.form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const p1 = views.pw1.value.trim();
    const p2 = views.pw2.value.trim();

    if (p1.length < 6) {
      showStatus("Password is too short (min 6 chars).", "err");
      return;
    }
    if (p1 !== p2) {
      showStatus("Passwords do not match.", "err");
      return;
    }

    views.btn.disabled = true;
    views.btn.innerHTML = `<span class="spinner"></span> Updating...`;
    views.status.style.display = "none";

    const { error } = await sb.auth.updateUser({ password: p1 });

    if (error) {
      views.btn.disabled = false;
      views.btn.textContent = "Update Password";
      showStatus(error.message, "err");
      return;
    }

    await sb.auth.signOut();

    views.form.innerHTML = `
      <div style="text-align:center; padding: 20px 0;">
        <svg style="width:48px;height:48px;color:#10b981;margin-bottom:12px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <h3 style="margin:0;color:#fff;font-size:1.2rem;">Password Updated</h3>
        <p style="color:#94a3b8;font-size:14px;margin-top:8px;">You can now close this page and log in with your new password.</p>
        <a href="login.html" class="submit-btn" style="margin-top:20px; width:100%; text-decoration:none;">Go to Login</a>
      </div>
    `;
  });

  init().catch(err => {
    views.loading.classList.add("hide");
    showStatus("System Error: " + err.message, "err");
  });

</script>
</body>
</html>
