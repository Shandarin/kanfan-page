<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reset Password - Kanfan</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 仅在重置密码页保留暗色背景 */
    body {
      background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
      color: var(--white);
    }
    .auth-container {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.1);
    }
    input {
      background: rgba(30, 41, 59, 0.5);
      color: white;
      border-color: rgba(148, 163, 184, 0.2);
    }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="card">
      <div id="loading-view">
        <h1 style="text-align:center; font-size:18px; opacity:0.8;">Verifying link...</h1>
      </div>

      <div id="main-view" class="hide">
        <h1>Reset Password</h1>
        <p class="subtitle">Enter your new password below.</p>

        <form id="form">
          <div class="field-group">
            <label for="pw1">New Password</label>
            <div class="input-wrapper">
              <input type="password" id="pw1" placeholder="At least 6 characters" required autocomplete="new-password">
              <button type="button" class="toggle-pw" onclick="togglePw('pw1')" title="Toggle visibility">
                <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
          </div>

          <div class="field-group">
            <label for="pw2">Confirm Password</label>
            <div class="input-wrapper">
              <input type="password" id="pw2" placeholder="Confirm new password" required autocomplete="new-password">
              <button type="button" class="toggle-pw" onclick="togglePw('pw2')" title="Toggle visibility">
                <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
          </div>

          <button type="submit" id="btn" class="submit-btn">Update Password</button>
        </form>
      </div>

      <div id="status-box" class="msg hidden"></div>
    </div>
  </div>

<script>
  // ========= 配置区域 =========
  // 请替换为你真实的 Supabase URL 和 Key
  const SUPABASE_URL = "https://ikriqgjylpbwqihwpsho.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_xdQsvfTfJEwfNjF5KYvxLA_y4QiKqFo"; 
  // ==========================

  // UI 元素引用
  const views = {
    loading: document.getElementById("loading-view"),
    main: document.getElementById("main-view"),
    status: document.getElementById("status-box"),
    btn: document.getElementById("btn"),
    form: document.getElementById("form"),
    pw1: document.getElementById("pw1"),
    pw2: document.getElementById("pw2")
  };

  // 初始化 Supabase 客户端
  let sb;
  try {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch (e) {
    showStatus("Failed to load Supabase client. Check script tags.", "err");
  }

  // 状态显示工具
  function showStatus(text, type) {
    views.status.textContent = text;
    views.status.className = `msg ${type}`; // remove hidden, add type
    
    // 如果是错误，通常隐藏表单（视情况而定，这里保持表单显示以便重试，除非是致命错误）
    if (type === 'err' && text.includes("expired")) {
        views.main.classList.add("hide");
        views.loading.classList.add("hide");
    }
  }

  // 密码可见性切换
  window.togglePw = function(id) {
    const el = document.getElementById(id);
    el.type = el.type === "password" ? "text" : "password";
  }

  function clearUrlHash() {
    try {
      history.replaceState(null, document.title, window.location.pathname + window.location.search);
    } catch (_) {}
  }

  // 解析 Hash 参数
  function parseHashParams() {
    const hash = window.location.hash || "";
    if (!hash.startsWith("#")) return {};
    return hash.substring(1).split("&").reduce((acc, curr) => {
      const [k, v] = curr.split("=");
      if (k) acc[decodeURIComponent(k)] = decodeURIComponent(v || "");
      return acc;
    }, {});
  }

  // 主流程
  async function init() {
    const p = parseHashParams();

    // 1. 处理错误回调 (例如 otp_expired)
    if (p.error) {
      const desc = (p.error_description || p.error).replace(/\+/g, " ");
      views.loading.classList.add("hide");
      showStatus(`Link Error: ${desc}. Please request a new password reset email.`, "err");
      return;
    }

    // 2. 检查 Token
    const access_token = p.access_token;
    const refresh_token = p.refresh_token;
    const type = p.type;

    if (!access_token || !refresh_token) {
        views.loading.classList.add("hide");
        showStatus("Invalid link: Missing tokens. Please check your email again.", "err");
        return;
    }

    if (type && type !== "recovery") {
        views.loading.classList.add("hide");
        showStatus("Invalid link type. This is not a password recovery link.", "err");
        return;
    }

    // 清理 URL，避免 Token 泄露
    clearUrlHash();

    // 3. 建立会话
    const { error } = await sb.auth.setSession({ access_token, refresh_token });

    views.loading.classList.add("hide");

    if (error) {
      showStatus(`Session Error: ${error.message}. Please try requesting a new link.`, "err");
      return;
    }

    // 4. 显示重置表单
    views.main.classList.remove("hide");
  }

  // 表单提交处理
  views.form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const p1 = views.pw1.value.trim();
    const p2 = views.pw2.value.trim();

    // 本地校验
    if (p1.length < 6) {
      showStatus("Password is too short (min 6 chars).", "err");
      return;
    }
    if (p1 !== p2) {
      showStatus("Passwords do not match.", "err");
      return;
    }

    // UI Loading 状态
    views.btn.disabled = true;
    views.btn.innerHTML = `<span class="spinner"></span> Updating...`;
    views.status.className = "msg hidden"; // 清除旧消息

    // 提交更新
    const { error } = await sb.auth.updateUser({ password: p1 });

    if (error) {
      views.btn.disabled = false;
      views.btn.textContent = "Update Password";
      showStatus(error.message, "err");
      return;
    }

    // 成功后登出 (安全最佳实践)
    await sb.auth.signOut();

    views.form.innerHTML = `
      <div style="text-align:center; padding: 20px 0;">
        <svg style="width:48px;height:48px;color:#10b981;margin-bottom:12px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <h3 style="margin:0;color:#fff;">Password Updated</h3>
        <p style="color:var(--text-muted);font-size:14px;">You can now close this page and log in with your new password.</p>
      </div>
    `;
  });

  // 启动
  init().catch(err => {
    views.loading.classList.add("hide");
    showStatus("System Error: " + err.message, "err");
  });

</script>
</body>
</html>
