<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Kanfan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="i18n.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

<div class="language-switcher" data-lang-switcher></div>
<div class="auth-container flush">

    <div id="view-auth" class="card">
        <a href="index.html" class="logo" aria-label="Kanfan home">
            <img src="logo.png" alt="Kanfan" class="site-logo-img" onerror="this.hidden=true; this.nextElementSibling.hidden=false;">
            <span>Kanfan</span>
        </a>
        <h2 id="title" data-i18n="login.title">Welcome Back</h2>
        <p class="subtitle" id="subtitle" data-i18n="login.subtitle">Sign in to manage your subscription</p>

        <button type="button" class="btn btn-google" id="btn-google">
            <svg viewBox="0 0 24 24" width="24" height="24" xmlns="http://www.w3.org/2000/svg">
                <g transform="matrix(1, 0, 0, 1, 27.009001, -39.238998)">
                    <path fill="#4285F4" d="M -3.264 51.509 C -3.264 50.719 -3.334 49.969 -3.454 49.239 L -14.754 49.239 L -14.754 53.749 L -8.284 53.749 C -8.574 55.229 -9.424 56.479 -10.684 57.329 L -10.684 60.329 L -6.824 60.329 C -4.564 58.239 -3.264 55.159 -3.264 51.509 Z"/>
                    <path fill="#34A853" d="M -14.754 63.239 C -11.514 63.239 -8.804 62.159 -6.824 60.329 L -10.684 57.329 C -11.764 58.049 -13.134 58.489 -14.754 58.489 C -17.884 58.489 -20.534 56.379 -21.484 53.529 L -25.464 53.529 L -25.464 56.619 C -23.494 60.539 -19.444 63.239 -14.754 63.239 Z"/>
                    <path fill="#FBBC05" d="M -21.484 53.529 C -21.734 52.769 -21.864 51.959 -21.864 51.129 C -21.864 50.299 -21.734 49.489 -21.484 48.729 L -21.484 45.639 L -25.464 45.639 C -26.284 47.269 -26.754 49.129 -26.754 51.129 C -26.754 53.129 -26.284 54.989 -25.464 56.619 L -21.484 53.529 Z"/>
                    <path fill="#EA4335" d="M -14.754 43.769 C -12.984 43.769 -11.424 44.369 -10.174 45.579 L -6.714 42.119 C -8.804 40.169 -11.514 39.019 -14.754 39.019 C -19.444 39.019 -23.494 41.719 -25.464 45.639 L -21.484 48.729 C -20.534 45.879 -17.884 43.769 -14.754 43.769 Z"/>
                </g>
            </svg>
            <span data-i18n="login.google">Continue with Google</span>
        </button>

        <div class="divider">
            <span data-i18n="login.or">or</span>
        </div>

        <form id="auth-form">
            <div class="form-group">
                <label data-i18n="login.email">Email</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label data-i18n="login.password">Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <div id="signup-verification" hidden>
                <div class="form-group">
                    <label for="signup-code" id="signup-code-label">Email verification code</label>
                    <input id="signup-code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" maxlength="10" disabled>
                </div>
                <button type="button" class="btn" id="resend-code">Resend code</button>
            </div>
            <div id="message-box" class="msg" role="status" aria-live="polite"></div>

            <button type="submit" class="btn" id="btn-submit" data-i18n="login.submitIn">Sign In</button>
        </form>

        <div class="toggle-text">
            <span id="toggle-desc" data-i18n="login.noAccount">Don't have an account?</span>
            <a class="toggle-link" id="toggle-btn" data-i18n="login.create">Create one</a>
        </div>
        <div class="form-footer">
            <a href="reset-password.html" class="link-muted" data-i18n="login.forgot">Forgot Password?</a>
        </div>
    </div>

    <div id="view-success" class="card success-view">
        <div class="success-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <h2 data-i18n="login.successTitle">Successfully Signed In</h2>
        <p class="success-copy">
            <span data-i18n="login.successDesc">You have successfully logged in. Your extension is now synced.</span>
        </p>
        <p class="success-copy">
            <span data-i18n="login.successTip">You can verify your status in the extension popup.</span>
        </p>
        <button type="button" class="btn btn-dark" data-close-window data-i18n="login.close">Close Window</button>
    </div>

</div>

<script>
    // Config (Consistent with background.js)
    const SUPABASE_URL = "https://ikriqgjylpbwqihwpsho.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_xdQsvfTfJEwfNjF5KYvxLA_y4QiKqFo";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // State
    const params = new URLSearchParams(window.location.search);
    const source = params.get('source'); // 'extension' or null
    let isLoginMode = true;
    let pendingSignupEmail = null;
    let authBusy = false;
    let resendAt = 0;
    let resendTimer;
    function signupText(en, zh) {
        return KanfanI18n.getLang().startsWith('zh') ? zh : en;
    }
    KanfanI18n.renderSelect(document.querySelector('[data-lang-switcher]'));
    KanfanI18n.apply();

    // Elements
    const form = document.getElementById('auth-form');
    const emailEl = document.getElementById('email');
    const passEl = document.getElementById('password');
    const btnSubmit = document.getElementById('btn-submit');
    const btnGoogle = document.getElementById('btn-google');
    const msgBox = document.getElementById('message-box');
    const viewAuth = document.getElementById('view-auth');
    const viewSuccess = document.getElementById('view-success');
    const codeEl = document.getElementById('signup-code');
    const verificationEl = document.getElementById('signup-verification');
    const resendEl = document.getElementById('resend-code');
    function renderSignupStep() {
        const verifying = !!pendingSignupEmail;
        verificationEl.hidden = !verifying;
        codeEl.disabled = !verifying || authBusy;
        codeEl.required = verifying;
        emailEl.readOnly = verifying || authBusy;
        passEl.disabled = verifying || authBusy;
        passEl.autocomplete = isLoginMode ? 'current-password' : 'new-password';
        document.getElementById('signup-code-label').textContent = signupText('Email verification code', '邮箱验证码');
        btnSubmit.removeAttribute('data-i18n');
        btnSubmit.textContent = authBusy ? signupText('Processing...', '处理中…')
            : verifying ? signupText('Verify and register', '验证并完成注册')
            : isLoginMode ? KanfanI18n.t('login.submitIn') : signupText('Send verification code', '发送注册验证码');
        const seconds = Math.max(0, Math.ceil((resendAt - Date.now()) / 1000));
        resendEl.disabled = authBusy || seconds > 0;
        resendEl.textContent = signupText('Resend code', '重新发送验证码') + (seconds ? ` (${seconds}s)` : '');
        if (!seconds) clearInterval(resendTimer);
    }
    function startResendCooldown() {
        resendAt = Date.now() + 60000;
        clearInterval(resendTimer);
        resendTimer = setInterval(renderSignupStep, 1000);
        renderSignupStep();
    }
    resendEl.addEventListener('click', async () => {
        if (!pendingSignupEmail || authBusy || Date.now() < resendAt) return;
        setLoading(true);
        try {
            const { error } = await sb.auth.resend({ type: 'signup', email: pendingSignupEmail });
            if (error) throw error;
            startResendCooldown();
            showMessage(signupText('A new code has been sent. Check your inbox and spam folder.', '验证码已重新发送，请检查邮箱和垃圾邮件。'), 'success');
        } catch (err) { showMessage(err.message, 'error'); }
        finally { setLoading(false); }
    });
    document.querySelector('[data-lang-switcher]').addEventListener('change', renderSignupStep);
    document.querySelector('[data-close-window]')?.addEventListener('click', () => window.close());

    // Toggle Login/Signup
    document.getElementById('toggle-btn').addEventListener('click', () => {
        if (authBusy) return;
        pendingSignupEmail = null;
        codeEl.value = '';
        clearInterval(resendTimer);
        resendAt = 0;
        isLoginMode = !isLoginMode;
        document.getElementById('title').textContent = isLoginMode ? KanfanI18n.t('login.title') : 'Create Account';
        document.getElementById('subtitle').textContent = isLoginMode ? KanfanI18n.t('login.subtitle') : 'Start your manga translation journey';
        btnSubmit.textContent = isLoginMode ? KanfanI18n.t('login.submitIn') : KanfanI18n.t('login.submitUp');
        document.getElementById('toggle-desc').textContent = isLoginMode ? KanfanI18n.t('login.noAccount') : KanfanI18n.t('login.haveAccount');
        document.getElementById('toggle-btn').textContent = isLoginMode ? KanfanI18n.t('login.create') : KanfanI18n.t('login.submitIn');
        msgBox.className = 'msg';
        msgBox.textContent = '';
        renderSignupStep();
    });

    // 1. Check if already logged in (Handles page load AND OAuth redirect return)
    async function checkSession() {
        const { data: { session } } = await sb.auth.getSession();
        if (session) {
            handleAuthSuccess(session);
        }
    }
    checkSession();

    // 2a. Handle Google SSO
    btnGoogle.addEventListener('click', async () => {
        try {
            // We use window.location.href to return to this exact page (preserving ?source=extension)
            const { error } = await sb.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.href
                }
            });
            if (error) throw error;
            // Note: Redirect will happen, no need to manually stop loading unless error
        } catch (err) {
            showMessage(err.message, "error");
        }
    });

    // 2b. Handle Email/Password Submit
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (authBusy) return;
        setLoading(true);
        const email = emailEl.value.trim();
        const password = passEl.value;
        try {
            let result;
            if (isLoginMode) {
                result = await sb.auth.signInWithPassword({ email, password });
            } else if (pendingSignupEmail) {
                result = await sb.auth.verifyOtp({ email: pendingSignupEmail, token: codeEl.value.trim(), type: 'email' });
                if (!result.error && !result.data.session) throw new Error(signupText('Verification did not complete. Please try again.', '验证未完成，请重试。'));
            } else {
                // Fail before creating an account if server-side email confirmation is disabled.
                const response = await fetch(`${SUPABASE_URL}/auth/v1/settings`, { headers: { apikey: SUPABASE_ANON_KEY } });
                if (!response.ok) throw new Error(signupText('Registration is temporarily unavailable.', '注册暂不可用，请稍后重试。'));
                const settings = await response.json();
                if (settings.mailer_autoconfirm !== false) throw new Error(signupText('Email verification is not ready. Please try again later.', '邮箱验证暂未就绪，请稍后重试。'));
                result = await sb.auth.signUp({ email, password });
                if (result.error) throw result.error;
                if (result.data.session) {
                    await sb.auth.signOut({ scope: 'local' });
                    throw new Error(signupText('Email verification is required. Please contact support.', '注册必须验证邮箱，请联系支持。'));
                }
                pendingSignupEmail = email;
                passEl.value = '';
                startResendCooldown();
                showMessage(signupText('Check your email for the registration code. Enter it below to finish. If you already have an account, sign in instead.', '请查看邮箱中的注册验证码，输入后完成注册。已有账号请切换到登录。'), 'success');
                return;
            }
            if (result.error) throw result.error;
            if (result.data.session) handleAuthSuccess(result.data.session);
        } catch (err) {
            showMessage(err.message, 'error');
        } finally {
            setLoading(false);
            if (pendingSignupEmail) codeEl.focus();
        }
    });

    function broadcastAuthToExtension(session) {
        try {
            window.postMessage(
                {
                    type: "KANFAN_WEB_AUTH",
                    payload: {
                        access_token: session.access_token,
                        refresh_token: session.refresh_token,
                        expires_in: session.expires_in,
                        user: session.user
                    }
                },
                "*" // 最稳：同窗口 postMessage 给 content script，用 * 不会卡 origin
            );
        } catch (e) {
            console.warn("postMessage failed:", e);
        }
    }

    // 3. Handle Success & Extension Sync
    function handleAuthSuccess(session) {
        broadcastAuthToExtension(session);
        if (source === 'extension') {
            // A. Sync with Extension
            viewAuth.style.display = 'none';
            viewSuccess.style.display = 'block';

        } else {
            window.location.href = 'index.html';
        }
    }

    // Helpers
    function setLoading(isLoading) {
        authBusy = isLoading;
        btnSubmit.disabled = isLoading;
        btnGoogle.disabled = isLoading;
        renderSignupStep();
    }

    function showMessage(text, type) {
        msgBox.textContent = text;
        msgBox.className = `msg ${type}`;
    }
</script>
</body>
</html>
