<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Kanfan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #f97316;
            --primary-hover: #ea580c;
            --dark: #0f172a;
            --slate: #64748b;
            --light: #f8fafc;
            --danger: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--light);
            color: var(--dark);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        .auth-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .logo { 
            font-size: 1.5rem; 
            font-weight: 800; 
            color: var(--primary); 
            text-decoration: none; 
            margin-bottom: 30px;
            display: inline-block;
        }

        h2 { font-size: 1.5rem; margin-bottom: 10px; }
        p.subtitle { color: var(--slate); margin-bottom: 30px; font-size: 0.9rem; }

        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: var(--slate); }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.2s;
        }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1); }

        .btn {
            width: 100%;
            background: var(--primary);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn:hover { background: var(--primary-hover); }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; }

        .toggle-text { margin-top: 20px; font-size: 0.9rem; color: var(--slate); }
        .toggle-link { color: var(--primary); cursor: pointer; font-weight: 600; text-decoration: none; }
        .toggle-link:hover { text-decoration: underline; }

        .msg {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
        }
        .msg.error { background: #fef2f2; color: var(--danger); display: block; }
        .msg.success { background: #f0fdf4; color: #15803d; display: block; }

        /* Success State for Extension */
        .success-view { display: none; }
        .success-icon { 
            width: 60px; height: 60px; 
            background: #dcfce7; color: #15803d;
            border-radius: 50%; 
            display: flex; align-items: center; justifyContent: center;
            margin: 0 auto 20px;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        
        <div id="view-auth" class="card">
            <a href="index.html" class="logo">Kanfan</a>
            <h2 id="title">Welcome Back</h2>
            <p class="subtitle" id="subtitle">Sign in to manage your subscription</p>

            <form id="auth-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                
                <div id="message-box" class="msg"></div>

                <button type="submit" class="btn" id="btn-submit">Sign In</button>
            </form>

            <div class="toggle-text">
                <span id="toggle-desc">Don't have an account?</span>
                <a class="toggle-link" id="toggle-btn">Create one</a>
            </div>
            <div style="margin-top: 15px;">
                 <a href="reset-password.html" style="font-size: 0.85rem; color: var(--slate); text-decoration: none;">Forgot Password?</a>
            </div>
        </div>

        <div id="view-success" class="card success-view">
            <div class="success-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
            <h2>Successfully Signed In</h2>
            <p style="color: var(--slate); margin-bottom: 20px;">
                You have successfully logged in. Your extension is now synced.
            </p>
            <p style="font-size: 0.9rem; color: var(--slate);">
                You can verify your status in the extension popup.
            </p>
            <button onclick="window.close()" class="btn" style="margin-top: 20px; background: var(--dark);">Close Window</button>
        </div>

    </div>

    <script>
        // Config (Consistent with background.js)
        const SUPABASE_URL = "https://ikriqgjylpbwqihwpsho.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_xdQsvfTfJEwfNjF5KYvxLA_y4QiKqFo";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // State
        const params = new URLSearchParams(window.location.search);
        const source = params.get('source'); // 'extension' or null
        let isLoginMode = true;

        // Elements
        const form = document.getElementById('auth-form');
        const emailEl = document.getElementById('email');
        const passEl = document.getElementById('password');
        const btnSubmit = document.getElementById('btn-submit');
        const msgBox = document.getElementById('message-box');
        const viewAuth = document.getElementById('view-auth');
        const viewSuccess = document.getElementById('view-success');

        // Toggle Login/Signup
        document.getElementById('toggle-btn').addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            document.getElementById('title').textContent = isLoginMode ? 'Welcome Back' : 'Create Account';
            document.getElementById('subtitle').textContent = isLoginMode ? 'Sign in to manage your subscription' : 'Start your manga translation journey';
            btnSubmit.textContent = isLoginMode ? 'Sign In' : 'Sign Up';
            document.getElementById('toggle-desc').textContent = isLoginMode ? "Don't have an account?" : "Already have an account?";
            document.getElementById('toggle-btn').textContent = isLoginMode ? "Create one" : "Sign In";
            msgBox.className = 'msg';
            msgBox.textContent = '';
        });

        // 1. Check if already logged in
        async function checkSession() {
            const { data: { session } } = await sb.auth.getSession();
            if (session) {
                handleAuthSuccess(session);
            }
        }
        checkSession();

        // 2. Handle Form Submit
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            setLoading(true);
            const email = emailEl.value.trim();
            const password = passEl.value.trim();

            try {
                let result;
                if (isLoginMode) {
                    result = await sb.auth.signInWithPassword({ email, password });
                } else {
                    result = await sb.auth.signUp({ email, password });
                }

                if (result.error) throw result.error;

                if (!isLoginMode && !result.data.session) {
                    // Signup success but needs email verification (optional handling)
                    showMessage("Account created! Please check your email to confirm.", "success");
                    setLoading(false);
                } else if (result.data.session) {
                    handleAuthSuccess(result.data.session);
                }
            } catch (err) {
                showMessage(err.message, "error");
                setLoading(false);
            }
        });

        // 3. Handle Success & Extension Sync
        function handleAuthSuccess(session) {
            if (source === 'extension') {
                // A. Sync with Extension
                viewAuth.style.display = 'none';
                viewSuccess.style.display = 'block';

                // Send message to Content Script (index.js will pick this up)
                window.postMessage({
                    type: "KANFAN_WEB_AUTH",
                    payload: {
                        access_token: session.access_token,
                        refresh_token: session.refresh_token,
                        expires_in: session.expires_in,
                        user: session.user
                    }
                }, window.location.origin);
                
                // Optional: Attempt to call extension directly if possible? 
                // No, standard way is postMessage to content script -> background.
                
            } else {
                // B. Normal Web Login -> Go to Account/Pricing
                window.location.href = 'account.html';
            }
        }

        // Helpers
        function setLoading(isLoading) {
            btnSubmit.disabled = isLoading;
            btnSubmit.innerHTML = isLoading ? '<span class="spinner"></span> Processing...' : (isLoginMode ? 'Sign In' : 'Sign Up');
        }

        function showMessage(text, type) {
            msgBox.textContent = text;
            msgBox.className = `msg ${type}`;
        }
    </script>
</body>
</html>
