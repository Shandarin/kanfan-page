<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Cancelled - Kanfan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="i18n.js"></script>
</head>
<body class="status-page">
    <div class="language-switcher" data-lang-switcher></div>
    <main class="container status-card">
        <div class="icon-box warn">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </div>
        <h1 data-i18n="pay.cancelTitle">Payment Cancelled</h1>
        <p data-i18n="pay.cancelDesc">No charges were made. If you encountered an error or have questions about our plans, feel free to contact us.</p>
        <a href="index.html#pricing" class="btn" data-i18n="pay.returnHome">Return Home</a>
    </main>
    <script>
        KanfanI18n.renderSelect(document.querySelector("[data-lang-switcher]"));
        KanfanI18n.apply();
    </script>
</body>
</html>
