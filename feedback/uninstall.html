<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uninstall Feedback - Kanfan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <script src="/i18n.js"></script>
</head>

<body class="form-page">
<main class="feedback-container">
    <div class="page-card-header">
        <a href="/" class="brand-mark" aria-label="Kanfan home">
            <span>Kanfan</span>
        </a>
        <h1 class="feedback-title" data-i18n="uninstall.title">Sorry to see you go</h1>
        <p class="feedback-desc" data-i18n="uninstall.desc">Please tell us why you're uninstalling. It helps us improve.</p>
    </div>

    <form id="uninstall-form" method="POST">
        <div class="radio-group">
            <label class="radio-label">
                <input type="checkbox" name="reasons" value="Too slow / Not working" />
                <span data-i18n="uninstall.reason.performance">Too slow / Not working</span>
            </label>
            <label class="radio-label">
                <input type="checkbox" name="reasons" value="Translation quality is not good" />
                <span data-i18n="uninstall.reason.translation">Translation quality is not good</span>
            </label>
            <label class="radio-label">
                <input type="checkbox" name="reasons" value="Hard to use / Confusing UI" />
                <span data-i18n="uninstall.reason.missing_feature">Hard to use / Confusing UI</span>
            </label>
            <label class="radio-label">
                <input type="checkbox" name="reasons" value="Too expensive" />
                <span data-i18n="uninstall.reason.pricing">Too expensive</span>
            </label>
            <label class="radio-label">
                <input type="checkbox" name="reasons" value="Privacy concerns" />
                <span data-i18n="uninstall.reason.bug">Bug or privacy concern</span>
            </label>
            <label class="radio-label">
                <input type="checkbox" name="reasons" value="I found an alternative" />
                <span data-i18n="uninstall.reason.alternative">I found an alternative</span>
            </label>
            <label class="radio-label">
                <input type="checkbox" name="reasons" value="Other" />
                <span data-i18n="uninstall.reason.other">Other</span>
            </label>
        </div>

        <textarea class="textarea-box" name="comment" placeholder="Anything else you'd like to share?" data-i18n-placeholder="uninstall.commentPlaceholder"></textarea>

        <input type="hidden" name="source" id="meta-from">
        <input type="hidden" name="language" id="meta-lang">
        <input type="hidden" name="extension_version" id="meta-v">
        <input type="hidden" name="uuid" id="meta-uuid">
        <input type="hidden" name="uid" id="meta-uid">
        <input type="hidden" name="email" id="meta-email">
        <input type="hidden" name="last_url" id="meta-last-url">

        <button type="submit" class="submit-btn" data-i18n="uninstall.submit">Submit</button>

        <div class="success-msg" id="successMsg" data-i18n="uninstall.success">Thank you! Your feedback has been submitted.</div>
        <div class="error-msg" id="errorMsg" data-i18n="uninstall.error">Oops! Something went wrong. Please try again.</div>
    </form>
</main>

<script>
    function setIfExists(id, value) {
        const el = document.getElementById(id);
        if (!el) return;
        el.value = value || "";
    }

    function normalizeEmail(email) {
        return (email || "").trim();
    }

    function applyLangFromQuery(qs) {
        const lang = (qs.get("lang") || "").trim();
        if (!lang) return "";

        let appliedLang = lang;
        try {
            if (window.KanfanI18n && typeof window.KanfanI18n.setLang === "function") {
                appliedLang = window.KanfanI18n.setLang(lang);
            } else if (window.KanfanI18n && typeof window.KanfanI18n.init === "function") {
                appliedLang = window.KanfanI18n.init({ lang });
            }
        } catch (e) {}

        document.documentElement.lang = appliedLang;
        setIfExists("meta-lang", appliedLang);
        return appliedLang;
    }

    (function initFromUrlParams() {
        const qs = new URLSearchParams(location.search);
        const appliedLang = applyLangFromQuery(qs);
        if (window.KanfanI18n && typeof window.KanfanI18n.apply === "function") {
            window.KanfanI18n.apply();
            document.title = `${window.KanfanI18n.t("uninstall.title")} - Kanfan`;
            setIfExists("meta-lang", appliedLang || window.KanfanI18n.getLang());
        }

        setIfExists("meta-from", qs.get("from") || "");
        setIfExists("meta-v", qs.get("v") || "");
        setIfExists("meta-uuid", qs.get("uuid") || "");
        setIfExists("meta-uid", qs.get("uid") || "");
        setIfExists("meta-email", normalizeEmail(qs.get("email") || ""));
        setIfExists("meta-last-url", qs.get("lastUrl") || "");
    })();

    const form = document.getElementById("uninstall-form");
    const successMsg = document.getElementById("successMsg");
    const errorMsg = document.getElementById("errorMsg");
    const feedbackEndpoint = "https://jicbnty4ugip4n7rsn6xjg3moe0poghf.lambda-url.us-west-1.on.aws/";

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const checked = form.querySelectorAll('input[name="reasons"]:checked');
        const comment = (form.querySelector('textarea[name="comment"]')?.value || "").trim();
        if (checked.length === 0 && !comment) {
            errorMsg.style.display = "block";
            errorMsg.textContent = "Please select at least one reason or write a comment.";
            return;
        }

        successMsg.style.display = "none";
        errorMsg.style.display = "none";

        if (!feedbackEndpoint || feedbackEndpoint.includes("REPLACE_WITH")) {
            errorMsg.style.display = "block";
            errorMsg.textContent = "Feedback endpoint is not configured.";
            return;
        }

        try {
            const formData = new FormData(form);
            const payload = {
                type: "uninstall",
                reasons: formData.getAll("reasons"),
                comment,
                source: formData.get("source") || "",
                language: formData.get("language") || "",
                extension_version: formData.get("extension_version") || "",
                uuid: formData.get("uuid") || "",
                user_id: formData.get("uid") || "",
                email: formData.get("email") || "",
                last_url: formData.get("last_url") || "",
                page_url: window.location.href,
                user_agent: navigator.userAgent
            };
            const res = await fetch(feedbackEndpoint, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                form.reset();
                successMsg.style.display = "block";
            } else {
                errorMsg.style.display = "block";
            }
        } catch (err) {
            errorMsg.style.display = "block";
        }
    });
</script>
</body>
</html>
